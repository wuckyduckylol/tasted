name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 20

      - name: Tests with enforced coverage (scoring lib ≥95%)
        run: npm run test:coverage -- --ci

      # Moderate advisories in the Expo toolchain are expected between SDK
      # upgrades; fail CI only on high/critical.
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
